name: Build custom Codex for Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-custom-windows-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-smoke:
    name: rust-v0.151.0 / Windows x64
    runs-on: windows-latest
    timeout-minutes: 330
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      CARGO_TERM_COLOR: always
      SOURCE_COMMIT: 78c290807ce710180111df227df3b7a4fe845452
      PATCH_TREE: 06b0fd4a6121d0cc3b94b3e2d5c923122f5d6c7b
      TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6

      - name: Set up package-builder Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch exact upstream and apply 15-patch series
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-codex
          git -C upstream-codex remote add origin https://github.com/openai/codex.git
          git -C upstream-codex fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C upstream-codex checkout --detach FETCH_HEAD
          test "$(git -C upstream-codex rev-parse HEAD)" = "$SOURCE_COMMIT"
          git -C upstream-codex config user.name github-actions
          git -C upstream-codex config user.email github-actions@users.noreply.github.com
          bash custom-patches/apply-series.sh upstream-codex
          test "$(git -C upstream-codex rev-parse 'HEAD^{tree}')" = "$PATCH_TREE"

      - name: Prepare locked source provenance
        id: provenance
        working-directory: upstream-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/version = "0\.0\.0"/version = "0.151.0"/g' Cargo.lock
          compiled_lock_sha256=$(sha256sum Cargo.lock | awk '{print $1}')
          git -C .. add codex-rs/Cargo.lock
          compiled_tree=$(git -C .. write-tree)
          test "$compiled_tree" = "$PATCH_TREE"
          printf 'compiled_lock_sha256=%s\n' "$compiled_lock_sha256" >> "$GITHUB_OUTPUT"
          printf 'COMPILED_TREE=%s\n' "$compiled_tree" >> "$GITHUB_ENV"

      - name: Cache Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-windows-x64-rust1.95.0-${{ steps.provenance.outputs.compiled_lock_sha256 }}
          restore-keys: cargo-downloads-windows-x64-rust1.95.0-

      - name: Resolve checksum-verified Windows V8 inputs
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_REPO_ROOT="$GITHUB_WORKSPACE/upstream-codex"
          export PYTHONPATH="$CODEX_REPO_ROOT/scripts"
          python - "$GITHUB_ENV" "$TARGET" <<'PY'
          import sys

          from codex_package.targets import TARGET_SPECS
          from codex_package.v8 import resolve_codex_v8_cargo_env

          output, target = sys.argv[1:]
          values = resolve_codex_v8_cargo_env(TARGET_SPECS[target])
          with open(output, "a", encoding="utf-8") as github_env:
              for name, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise ValueError(f"invalid newline in {name}")
                  github_env.write(f"{name}={value}\n")
          PY

      - name: Run focused changed-surface tests
        working-directory: upstream-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --target "$TARGET" -p codex-tui scrollback
          cargo test --locked --target "$TARGET" -p codex-tui resize_reflow
          cargo test --locked --target "$TARGET" -p codex-app-server session_runtime
          cargo test --locked --target "$TARGET" -p codex-app-server-transport

      - name: Validate provider contract tooling
        shell: bash
        run: |
          set -euo pipefail
          python release-manifests/codex-a/test_runtime_artifact_v1.py
          python release-manifests/codex-a/test_runtime_artifact_v2.py

      - name: Build native release binaries
        working-directory: upstream-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$TARGET" \
            -p codex-cli --bin codex \
            -p codex-app-server --bin codex-app-server \
            -p codex-code-mode-host --bin codex-code-mode-host \
            -p codex-windows-sandbox --bin codex-command-runner \
            -p codex-windows-sandbox --bin codex-windows-sandbox-setup

      - name: Assemble Windows packages
        shell: bash
        run: |
          set -euo pipefail
          binary_dir="$CARGO_TARGET_DIR/$TARGET/release"
          mkdir -p dist
          export CODEX_REPO_ROOT="$GITHUB_WORKSPACE/upstream-codex"
          python upstream-codex/scripts/build_codex_package.py \
            --target "$TARGET" \
            --variant codex \
            --package-version 0.151.0 \
            --package-dir "$RUNNER_TEMP/codex-package-$TARGET" \
            --archive-output "$GITHUB_WORKSPACE/dist/codex-package-$TARGET.zip" \
            --entrypoint-bin "$binary_dir/codex.exe" \
            --code-mode-host-bin "$binary_dir/codex-code-mode-host.exe" \
            --codex-command-runner-bin "$binary_dir/codex-command-runner.exe" \
            --codex-windows-sandbox-setup-bin "$binary_dir/codex-windows-sandbox-setup.exe"
          python upstream-codex/scripts/build_codex_package.py \
            --target "$TARGET" \
            --variant codex-app-server \
            --package-version 0.151.0 \
            --package-dir "$RUNNER_TEMP/codex-app-server-package-$TARGET" \
            --archive-output "$GITHUB_WORKSPACE/dist/codex-app-server-package-$TARGET.zip" \
            --entrypoint-bin "$binary_dir/codex-app-server.exe" \
            --code-mode-host-bin "$binary_dir/codex-code-mode-host.exe" \
            --codex-command-runner-bin "$binary_dir/codex-command-runner.exe" \
            --codex-windows-sandbox-setup-bin "$binary_dir/codex-windows-sandbox-setup.exe"
          {
            printf 'source_revision=%s\n' "$GITHUB_SHA"
            printf 'upstream_commit=%s\n' "$SOURCE_COMMIT"
            printf 'patched_tree=%s\n' "$PATCH_TREE"
            printf 'compiled_tree=%s\n' "$COMPILED_TREE"
            printf 'target=%s\n' "$TARGET"
          } > dist/BUILD-METADATA.windows-x64.txt

      - name: Smoke packaged CLI and direct app-server
        shell: bash
        env:
          PRIMARY_ZIP: ${{ github.workspace }}/dist/codex-package-x86_64-pc-windows-msvc.zip
          APP_SERVER_ZIP: ${{ github.workspace }}/dist/codex-app-server-package-x86_64-pc-windows-msvc.zip
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/codex-windows-smoke"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root/primary" "$smoke_root/app-server" "$smoke_root/codex-home" "$smoke_root/sqlite"
          python - "$PRIMARY_ZIP" "$APP_SERVER_ZIP" "$smoke_root" <<'PY'
          import json
          import os
          from pathlib import Path
          import queue
          import subprocess
          import sys
          import threading
          import time
          import zipfile

          primary_zip, app_server_zip, smoke_root_arg = sys.argv[1:]
          root = Path(smoke_root_arg)
          primary = root / "primary"
          app_server = root / "app-server"
          with zipfile.ZipFile(primary_zip) as archive:
              archive.extractall(primary)
          with zipfile.ZipFile(app_server_zip) as archive:
              archive.extractall(app_server)

          expected_metadata = (
              (primary / "codex-package.json", "codex", "bin/codex.exe"),
              (app_server / "codex-package.json", "codex-app-server", "bin/codex-app-server.exe"),
          )
          for path, variant, entrypoint in expected_metadata:
              package = json.loads(path.read_text(encoding="utf-8"))
              assert package == {
                  "layoutVersion": 1,
                  "version": "0.151.0",
                  "target": "x86_64-pc-windows-msvc",
                  "variant": variant,
                  "entrypoint": entrypoint,
                  "resourcesDir": "codex-resources",
                  "pathDir": "codex-path",
              }
              assert (path.parent / entrypoint).is_file()
              assert (path.parent / "bin/codex-code-mode-host.exe").is_file()
              assert (path.parent / "codex-path/rg.exe").is_file()
              assert (path.parent / "codex-resources/codex-command-runner.exe").is_file()
              assert (path.parent / "codex-resources/codex-windows-sandbox-setup.exe").is_file()

          codex = primary / "bin/codex.exe"
          version = subprocess.run(
              [str(codex), "--version"],
              check=True,
              capture_output=True,
              text=True,
              timeout=30,
          )
          assert "0.151.0" in version.stdout

          env = os.environ.copy()
          env.update(
              CODEX_HOME=str(root / "codex-home"),
              CODEX_SQLITE_HOME=str(root / "sqlite"),
              RUST_LOG="error",
          )
          process = subprocess.Popen(
              [str(app_server / "bin/codex-app-server.exe"), "--listen", "stdio://"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              encoding="utf-8",
              env=env,
          )
          assert process.stdin is not None
          assert process.stdout is not None
          output_lines = queue.Queue()

          def read_output():
              try:
                  for line in process.stdout:
                      output_lines.put(line)
              finally:
                  output_lines.put(None)

          threading.Thread(target=read_output, daemon=True).start()

          def send(payload):
              process.stdin.write(json.dumps(payload, separators=(",", ":")) + "\n")
              process.stdin.flush()

          def response(request_id):
              deadline = time.monotonic() + 30
              while True:
                  remaining = deadline - time.monotonic()
                  assert remaining > 0, f"timed out waiting for response {request_id}"
                  try:
                      line = output_lines.get(timeout=remaining)
                  except queue.Empty as error:
                      raise AssertionError(
                          f"timed out waiting for response {request_id}"
                      ) from error
                  assert line, "app-server closed before response"
                  message = json.loads(line)
                  if message.get("id") == request_id:
                      return message

          try:
              send({
                  "id": 1,
                  "method": "initialize",
                  "params": {"clientInfo": {"name": "windows-package-smoke", "version": "0.1.0"}},
              })
              assert "result" in response(1)
              send({"method": "initialized"})
              send({
                  "id": 2,
                  "method": "sessionRuntime/list",
                  "params": {"cursor": None, "limit": 10, "threadId": None},
              })
              runtime = response(2)["result"]
              assert runtime["instanceEpoch"]
              capabilities = {item["name"]: item for item in runtime["capabilities"]}
              assert "__autoattach_probe" not in capabilities
              for name in (
                  "ananke_session_identity_v1",
                  "ananke_session_control_v1",
                  "ananke_thread_transition_v1",
              ):
                  assert capabilities[name]["available"] is True, capabilities[name]
          finally:
              process.stdin.close()
              try:
                  process.wait(timeout=20)
              except subprocess.TimeoutExpired:
                  process.terminate()
                  process.wait(timeout=20)
          assert process.returncode == 0, process.stderr.read() if process.stderr else ""

          (root / "SMOKE-RESULT.windows-x64.json").write_text(
              json.dumps(
                  {
                      "packagedCli": True,
                      "directAppServer": True,
                      "sessionRuntimeCapabilities": True,
                      "providerCalled": False,
                      "supervisorClaimed": False,
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          cp "$smoke_root/SMOKE-RESULT.windows-x64.json" dist/
          (cd dist && sha256sum \
            codex-package-x86_64-pc-windows-msvc.zip \
            codex-app-server-package-x86_64-pc-windows-msvc.zip \
            BUILD-METADATA.windows-x64.txt \
            SMOKE-RESULT.windows-x64.json > SHA256SUMS.windows-x64)
          (cd dist && sha256sum -c SHA256SUMS.windows-x64)

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-custom-rust-v0.151.0-windows-x64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
