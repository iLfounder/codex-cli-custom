name: Build custom Codex for macOS arm64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-custom-macos-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: rust-v0.149.0 / macOS arm64
    runs-on: macos-15
    timeout-minutes: 330
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      CARGO_TERM_COLOR: always
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: codex-macos15-arm64-rust1.95.0-release-incrementaloff-ltooff-cgu8-v1
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SOURCE_COMMIT: 758ef40f50c1a458425c7cfbf1eb12cbc07af0b0
      PATCH_TREE: 85dbbad8ec9ffde70c82f115a9822bd7771c6dcd

    steps:
      - name: Check out patch repository
        uses: actions/checkout@v6

      - name: Set up package-builder Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install compiler cache
        id: install_sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.17.0"
          disable_annotations: true

      - name: Configure compiler cache
        id: configure_sccache
        if: always()
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install_sccache.outcome }}
        run: |
          set -euo pipefail
          enabled=false
          if [[ "$INSTALL_OUTCOME" == "success" ]] \
            && [[ -n "${SCCACHE_PATH:-}" ]] \
            && [[ -x "${SCCACHE_PATH:-}" ]] \
            && [[ -n "${ACTIONS_RESULTS_URL:-}" ]] \
            && [[ -n "${ACTIONS_RUNTIME_TOKEN:-}" ]] \
            && "$SCCACHE_PATH" --version >/dev/null; then
            printf 'RUSTC_WRAPPER=%s\n' "$SCCACHE_PATH" >> "$GITHUB_ENV"
            printf 'CARGO_BUILD_RUSTC_WRAPPER=%s\n' "$SCCACHE_PATH" >> "$GITHUB_ENV"
            enabled=true
          else
            printf '%s\n' '::warning::sccache unavailable; build will use rustc directly'
          fi
          printf 'enabled=%s\n' "$enabled" >> "$GITHUB_OUTPUT"

      - name: Fetch the exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-codex
          git -C upstream-codex remote add origin https://github.com/openai/codex.git
          git -C upstream-codex fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C upstream-codex checkout --detach FETCH_HEAD
          test "$(git -C upstream-codex rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git -C upstream-codex status --porcelain)"

      - name: Apply the numbered patch series
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-codex config user.name github-actions
          git -C upstream-codex config user.email github-actions@users.noreply.github.com
          ./custom-patches/apply-series.sh upstream-codex
          test "$(git -C upstream-codex rev-parse HEAD^{tree})" = "$PATCH_TREE"

      - name: Prepare locked source provenance
        id: provenance
        working-directory: upstream-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # The release tag carries placeholder versions for workspace packages in Cargo.lock.
          # Normalize only those exact placeholders, then keep dependency resolution locked.
          perl -0pi -e 's/version = "0\.0\.0"/version = "0.149.0"/g' Cargo.lock
          compiled_lock_sha256=$(shasum -a 256 Cargo.lock | awk '{print $1}')
          git -C .. add codex-rs/Cargo.lock
          compiled_tree=$(git -C .. write-tree)
          printf 'compiled_lock_sha256=%s\n' "$compiled_lock_sha256" >> "$GITHUB_OUTPUT"
          printf 'COMPILED_LOCK_SHA256=%s\n' "$compiled_lock_sha256" >> "$GITHUB_ENV"
          printf 'COMPILED_TREE=%s\n' "$compiled_tree" >> "$GITHUB_ENV"

      - name: Cache Cargo downloads
        id: cargo_downloads
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-rust1.95.0-${{ steps.provenance.outputs.compiled_lock_sha256 }}
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-rust1.95.0-

      - name: Resolve the checksum-verified Codex V8 pair
        shell: bash
        run: |
          set -euo pipefail
          export CODEX_REPO_ROOT="$GITHUB_WORKSPACE/upstream-codex"
          export PYTHONPATH="$CODEX_REPO_ROOT/scripts"
          python3 - "$GITHUB_ENV" <<'PY'
          import hashlib
          import sys

          from codex_package.targets import TARGET_SPECS
          from codex_package.v8 import resolve_codex_v8_cargo_env
          from codex_package.v8 import resolved_v8_crate_version

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as artifact:
                  for chunk in iter(lambda: artifact.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          cargo_env = resolve_codex_v8_cargo_env(
              TARGET_SPECS["aarch64-apple-darwin"]
          )
          values = {
              **cargo_env,
              "CODEX_V8_VERSION": resolved_v8_crate_version(),
              "CODEX_V8_ARCHIVE_SHA256": sha256(cargo_env["RUSTY_V8_ARCHIVE"]),
              "CODEX_V8_BINDING_SHA256": sha256(
                  cargo_env["RUSTY_V8_SRC_BINDING_PATH"]
              ),
          }
          with open(sys.argv[1], "a", encoding="utf-8") as github_env:
              for name, value in values.items():
                  assert "\n" not in value
                  github_env.write(f"{name}={value}\n")
          PY

      - name: Build release binaries
        working-directory: upstream-codex/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.configure_sccache.outputs.enabled }}" != "true" ]] \
            || [[ ! -x "${RUSTC_WRAPPER:-}" ]]; then
            unset RUSTC_WRAPPER
            unset CARGO_BUILD_RUSTC_WRAPPER
          fi
          cargo build --locked --release \
            -p codex-cli --bin codex \
            -p codex-app-server --bin codex-app-server \
            -p codex-code-mode-host --bin codex-code-mode-host \
            -p codex-responses-api-proxy --bin codex-responses-api-proxy

      - name: Report compiler cache statistics
        if: always()
        shell: bash
        env:
          SCCACHE_ENABLED: ${{ steps.configure_sccache.outputs.enabled }}
          SCCACHE_INSTALL_OUTCOME: ${{ steps.install_sccache.outcome }}
          CARGO_CACHE_OUTCOME: ${{ steps.cargo_downloads.outcome }}
          CARGO_CACHE_HIT: ${{ steps.cargo_downloads.outputs.cache-hit }}
        run: |
          set -u
          stats='sccache disabled; rustc compiled directly'
          if [[ "$SCCACHE_ENABLED" == "true" ]] \
            && [[ -n "${SCCACHE_PATH:-}" ]] \
            && [[ -x "${SCCACHE_PATH:-}" ]]; then
            stats=$("$SCCACHE_PATH" --show-stats 2>&1 || true)
          fi
          printf '%s\n' "$stats"
          {
            printf '### Build caches\n\n'
            printf -- '- sccache install: `%s`\n' "$SCCACHE_INSTALL_OUTCOME"
            printf -- '- sccache enabled: `%s`\n' "${SCCACHE_ENABLED:-false}"
            printf -- '- Cargo cache action: `%s`\n' "$CARGO_CACHE_OUTCOME"
            printf -- '- Cargo exact-key hit: `%s`\n\n' "${CARGO_CACHE_HIT:-false}"
            printf '```text\n'
            printf '%s\n' "$stats"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble canonical packages and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          strip -x \
            "$CARGO_TARGET_DIR/release/codex" \
            "$CARGO_TARGET_DIR/release/codex-app-server" \
            "$CARGO_TARGET_DIR/release/codex-code-mode-host" \
            "$CARGO_TARGET_DIR/release/codex-responses-api-proxy"

          export CODEX_REPO_ROOT="$GITHUB_WORKSPACE/upstream-codex"
          python3 upstream-codex/scripts/build_codex_package.py \
            --target aarch64-apple-darwin \
            --variant codex \
            --package-version 0.149.0 \
            --package-dir "$RUNNER_TEMP/codex-package-aarch64-apple-darwin" \
            --archive-output "$GITHUB_WORKSPACE/dist/codex-package-aarch64-apple-darwin.tar.gz" \
            --entrypoint-bin "$CARGO_TARGET_DIR/release/codex" \
            --code-mode-host-bin "$CARGO_TARGET_DIR/release/codex-code-mode-host"
          python3 upstream-codex/scripts/build_codex_package.py \
            --target aarch64-apple-darwin \
            --variant codex-app-server \
            --package-version 0.149.0 \
            --package-dir "$RUNNER_TEMP/codex-app-server-package-aarch64-apple-darwin" \
            --archive-output "$GITHUB_WORKSPACE/dist/codex-app-server-package-aarch64-apple-darwin.tar.gz" \
            --entrypoint-bin "$CARGO_TARGET_DIR/release/codex-app-server" \
            --code-mode-host-bin "$CARGO_TARGET_DIR/release/codex-code-mode-host"

          cp "$CARGO_TARGET_DIR/release/codex-responses-api-proxy" dist/
          cp LICENSE NOTICE dist/
          chmod 0755 dist/codex-responses-api-proxy
          {
            printf 'upstream_commit=%s\n' "$SOURCE_COMMIT"
            printf 'patched_tree=%s\n' "$PATCH_TREE"
            printf 'compiled_tree=%s\n' "$COMPILED_TREE"
            printf 'compiled_cargo_lock_sha256=%s\n' "$COMPILED_LOCK_SHA256"
            printf 'rusty_v8_version=%s\n' "$CODEX_V8_VERSION"
            printf 'rusty_v8_archive_sha256=%s\n' "$CODEX_V8_ARCHIVE_SHA256"
            printf 'rusty_v8_binding_sha256=%s\n' "$CODEX_V8_BINDING_SHA256"
            printf 'runner_arch=%s\n' "$(uname -m)"
            rustc --version
            cargo --version
            sw_vers
          } > dist/BUILD-METADATA.txt

          primary_dir="$RUNNER_TEMP/verify-codex-package"
          app_server_dir="$RUNNER_TEMP/verify-codex-app-server-package"
          mkdir -p "$primary_dir" "$app_server_dir"
          tar -xzf dist/codex-package-aarch64-apple-darwin.tar.gz -C "$primary_dir"
          tar -xzf dist/codex-app-server-package-aarch64-apple-darwin.tar.gz -C "$app_server_dir"
          test -x "$primary_dir/bin/codex"
          test -x "$primary_dir/bin/codex-code-mode-host"
          test -x "$primary_dir/codex-path/rg"
          test -x "$primary_dir/codex-resources/zsh/bin/zsh"
          test -x "$app_server_dir/bin/codex-app-server"
          test -x "$app_server_dir/bin/codex-code-mode-host"
          test -x "$app_server_dir/codex-path/rg"
          test -x "$app_server_dir/codex-resources/zsh/bin/zsh"
          cmp "$primary_dir/bin/codex-code-mode-host" "$app_server_dir/bin/codex-code-mode-host"
          cmp "$primary_dir/bin/codex-code-mode-host" "$CARGO_TARGET_DIR/release/codex-code-mode-host"
          python3 - "$primary_dir/codex-package.json" "$app_server_dir/codex-package.json" <<'PY'
          import json
          import sys

          expected = (
              ("codex", "bin/codex"),
              ("codex-app-server", "bin/codex-app-server"),
          )
          assert len(sys.argv[1:]) == len(expected)
          for path, (variant, entrypoint) in zip(sys.argv[1:], expected):
              with open(path, encoding="utf-8") as package_file:
                  package = json.load(package_file)
              assert package == {
                  "layoutVersion": 1,
                  "version": "0.149.0",
                  "target": "aarch64-apple-darwin",
                  "variant": variant,
                  "entrypoint": entrypoint,
                  "resourcesDir": "codex-resources",
                  "pathDir": "codex-path",
              }
          PY
          (
            cd dist
            shasum -a 256 \
              codex-package-aarch64-apple-darwin.tar.gz \
              codex-app-server-package-aarch64-apple-darwin.tar.gz \
              codex-responses-api-proxy \
              BUILD-METADATA.txt LICENSE NOTICE > SHA256SUMS
          )
          file \
            "$primary_dir/bin/codex" \
            "$primary_dir/bin/codex-code-mode-host" \
            "$app_server_dir/bin/codex-app-server" \
            dist/codex-responses-api-proxy

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-custom-rust-v0.149.0-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14
